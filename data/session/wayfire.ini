# Autark's default Wayfire configuration. Copy it to ~/.config/wayfire.ini (a new account gets it from /etc/skel) and
# change it in Settings > Keyboard, in Keyboard shortcuts (autark-keys), or by hand: Wayfire rereads the file when it changes.
# Every command here is a program from autark-tools; `cargo test -p autark-common` checks that they exist and that
# Settings knows a name for each shortcut. Monitors are left out on purpose: autark-displays remembers their layout.

# Core options ─────────────────────────────────────────────────────────────────

[core]

# `ipc` and `ipc-rules` are what the dock's window pictures and autark-shot's window picker read.
plugins = \
  alpha \
  animate \
  autostart \
  command \
  cube \
  decoration \
  expo \
  fast-switcher \
  fisheye \
  foreign-toplevel \
  grid \
  gtk-shell \
  idle \
  ipc \
  ipc-rules \
  invert \
  move \
  oswitch \
  place \
  resize \
  scale \
  scale-title-filter \
  session-lock \
  shortcuts-inhibit \
  switcher \
  vswitch \
  wayfire-shell \
  window-rules \
  wm-actions \
  wobbly \
  wrot \
  zoom

# Close focused window.
close_top_view = <super> KEY_Q | <alt> KEY_F4

# Workspaces arranged into a grid: 3 × 3.
vwidth = 3
vheight = 3

# Apps draw their own window frames.
preferred_decoration_mode = client

# Mouse bindings ───────────────────────────────────────────────────────────────

# Drag windows by holding down Super and left mouse button.
[move]
activate = <super> BTN_LEFT

# Resize them with right mouse button + Super.
[resize]
activate = <super> BTN_RIGHT

# Zoom in the desktop by scrolling + Super.
[zoom]
modifier = <super>

# Change opacity by scrolling with Super + Alt.
[alpha]
modifier = <super> <alt>

# Rotate windows with the mouse.
[wrot]
activate = <super> <ctrl> BTN_RIGHT

# Fisheye effect.
[fisheye]
toggle = <super> <ctrl> KEY_F

# Overview: Super on its own shows every window, big enough to read; click one, or press Escape. Typing filters the
# windows by title. Super+Tab shows the workspaces side by side ([expo] below).
[scale]
toggle = <super>
toggle_all = <super> <shift> KEY_TAB
spacing = 48
title_overlay = all
title_position = bottom
inactive_alpha = 0.85
allow_zoom = false
# Wayfire's own 750 ms is slow enough to distract.
duration = 120

# Startup commands ─────────────────────────────────────────────────────────────

[autostart]
# GTK apps start slowly, or fail to open from a desktop file, without this.
0_env = dbus-update-activation-environment --systemd WAYLAND_DISPLAY DISPLAY XAUTHORITY

# The shell is autark-tools'. wf-shell's panel and background are not started, and nothing else claims
# notifications, idle, gamma or outputs: autark-notifyd, autark-power, autark-nightlight and autark-displays do.
autostart_wf_shell = false
autark_bar = autark-bar
autark_dock = autark-dock
autark_wallpaper = autark-wallpaper
autark_notifyd = autark-notifyd
autark_lock = autark-lock --daemon
autark_launcher = autark-launcher --daemon
autark_switcher = autark-switcher
autark_nightlight = autark-nightlight daemon
autark_displays = autark-displays daemon
# Screen-off, sleep and the low-battery warning, from power.toml (Settings > Power).
autark_power = autark-power
# Tells you when hardware that needs attention appears (a USB device nothing drives, firmware that's missing).
autark_hw_watch = autark-hw watch

[command]

# Terminal
binding_terminal = <super> KEY_ENTER
command_terminal = autark-terminal
binding_terminal_alt = <ctrl> <alt> KEY_T
command_terminal_alt = autark-terminal

# Launcher
binding_launcher = <super> KEY_SPACE
command_launcher = autark-launcher

# Lock the screen
binding_lock = <super> <shift> KEY_ESC
command_lock = autark-lock

# Screenshots
binding_screenshot = KEY_SYSRQ
command_screenshot = autark-shot screen
binding_screenshot_interactive = <shift> KEY_SYSRQ
command_screenshot_interactive = autark-shot area

# Volume
repeatable_binding_volume_up = KEY_VOLUMEUP
command_volume_up = autark-osd volume up
repeatable_binding_volume_down = KEY_VOLUMEDOWN
command_volume_down = autark-osd volume down
binding_mute = KEY_MUTE
command_mute = autark-osd volume mute
binding_autark_mic_mute = KEY_MICMUTE
command_autark_mic_mute = autark-osd mic mute

# Screenshots and screen recording, as on a Mac with Super for Cmd.
binding_autark_shot_screen = <super> <shift> KEY_3
command_autark_shot_screen = autark-shot screen
binding_autark_shot_area = <super> <shift> KEY_4
command_autark_shot_area = autark-shot area
binding_autark_shot_options = <super> <shift> KEY_5
command_autark_shot_options = autark-shot options
# The same keys start and stop a recording.
binding_autark_record = <super> <shift> KEY_6
command_autark_record = autark-shot record
binding_autark_record_area = <super> <shift> KEY_7
command_autark_record_area = autark-shot record area

# Super+D shows the desktop. Wayfire's own brings every window back as soon as one returns, so this is autark-showdesktop.
binding_autark_showdesktop = <super> KEY_D
command_autark_showdesktop = autark-showdesktop

# Alt+Tab: a still row of app icons, most recent first; let go of Alt to switch. Alt+` cycles the app's own windows.
binding_autark_switch_next = <alt> KEY_TAB
command_autark_switch_next = autark-switcher next
binding_autark_switch_prev = <alt> <shift> KEY_TAB
command_autark_switch_prev = autark-switcher prev
binding_autark_switch_window_next = <alt> KEY_GRAVE
command_autark_switch_window_next = autark-switcher next-window
binding_autark_switch_window_prev = <alt> <shift> KEY_GRAVE
command_autark_switch_window_prev = autark-switcher prev-window

# Apps
binding_autark_files = <super> KEY_E
command_autark_files = autark-files
binding_autark_notes = <super> KEY_N
command_autark_notes = autark-notes
binding_autark_calc = <super> KEY_C
command_autark_calc = autark-calc
binding_autark_settings = <super> KEY_COMMA
command_autark_settings = autark-settings
binding_autark_clock = <super> KEY_T
command_autark_clock = autark-clock
binding_autark_keys = <super> KEY_SLASH
command_autark_keys = autark-keys
binding_autark_apps = <super> KEY_A
command_autark_apps = autark-launcher --apps
binding_autark_clipboard = <super> KEY_V
command_autark_clipboard = autark-launcher --clipboard
binding_autark_assistant = <super> KEY_K
command_autark_assistant = autark-launcher --assistant
binding_autark_activity = <ctrl> <shift> KEY_ESC
command_autark_activity = autark-monitor
binding_autark_force_quit = <ctrl> <alt> KEY_ESC
command_autark_force_quit = autark-monitor --force-quit

# System
binding_autark_lock_l = <super> KEY_L
command_autark_lock_l = autark-lock
binding_autark_notification_centre = <super> <shift> KEY_N
command_autark_notification_centre = gdbus call --session --dest org.autark.Notifications1 --object-path /org/autark/Notifications --method org.autark.Notifications1.Toggle
binding_autark_project = <super> KEY_P
command_autark_project = autark-osd screens
binding_autark_touchpad = <ctrl> <super> KEY_F24
command_autark_touchpad = autark-osd touchpad
binding_autark_bluetooth = KEY_BLUETOOTH
command_autark_bluetooth = autark-osd bluetooth

# Screen brightness
repeatable_binding_light_up = KEY_BRIGHTNESSUP
command_light_up = autark-osd brightness up
repeatable_binding_light_down = KEY_BRIGHTNESSDOWN
command_light_down = autark-osd brightness down

# Windows ──────────────────────────────────────────────────────────────────────

[wm-actions]
toggle_fullscreen = <super> KEY_F
toggle_maximize = <super> KEY_M
minimize = <super> KEY_H
toggle_always_on_top = <super> KEY_X

# Position the windows in certain regions of the output.
[grid]
#
# ⇱ ↑ ⇲   │ 7 8 9
# ← f →   │ 4 5 6
# ⇱ ↓ ⇲ d │ 1 2 3 0
# ‾   ‾
slot_bl = <super> KEY_KP1
slot_b = <super> KEY_KP2
slot_br = <super> KEY_KP3
slot_l = <super> KEY_LEFT | <super> KEY_KP4
slot_c = <super> KEY_UP | <super> KEY_KP5
slot_r = <super> KEY_RIGHT | <super> KEY_KP6
slot_tl = <super> KEY_KP7
slot_t = <super> KEY_KP8
slot_tr = <super> KEY_KP9
# Restore default.
restore = <super> KEY_DOWN | <super> KEY_KP0

# Wayfire's animated window switcher, on Alt+Esc now that Alt+Tab is autark-switcher.
[switcher]
next_view = <alt> KEY_ESC
prev_view = <alt> <shift> KEY_ESC

[fast-switcher]
activate = none

# Workspaces ───────────────────────────────────────────────────────────────────

# Switch to workspace.
[vswitch]
binding_left = <ctrl> <super> KEY_LEFT
binding_down = <ctrl> <super> KEY_DOWN
binding_up = <ctrl> <super> KEY_UP
binding_right = <ctrl> <super> KEY_RIGHT
# Move the focused window with the same key-bindings, but add Shift.
with_win_left = <ctrl> <super> <shift> KEY_LEFT
with_win_down = <ctrl> <super> <shift> KEY_DOWN
with_win_up = <ctrl> <super> <shift> KEY_UP
with_win_right = <ctrl> <super> <shift> KEY_RIGHT

# Show the current workspace row as a cube.
[cube]
activate = <ctrl> <alt> BTN_LEFT

# Show an overview of all workspaces. Super+Tab (Super+E is Files).
[expo]
toggle = <super> KEY_TAB
# Select a workspace, numbered left to right, line by line.
select_workspace_1 = KEY_1
select_workspace_2 = KEY_2
select_workspace_3 = KEY_3
select_workspace_4 = KEY_4
select_workspace_5 = KEY_5
select_workspace_6 = KEY_6
select_workspace_7 = KEY_7
select_workspace_8 = KEY_8
select_workspace_9 = KEY_9

# Outputs ──────────────────────────────────────────────────────────────────────

[oswitch]
next_output = <super> KEY_O
next_output_with_win = <super> <shift> KEY_O

# Invert the colors of the whole output.
[invert]
toggle = <super> KEY_I

# Super on its own is the overview ([scale]) and Super+Space is the launcher, so wf-shell's menu key is off.
[wayfire-shell]
toggle_menu = none
