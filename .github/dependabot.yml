version: 2
updates:
  # The actions the workflows use (checkout, artifacts): a pull request when one has a new version.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
  # Cargo: patch and minor updates arrive together in one weekly pull request; a major update is its own.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: [dependencies]
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
