[package]
name = "autark-pim"
description = "Calendars, tasks, contacts and mail over open protocols: iCalendar, vCard, CalDAV, CardDAV, IMAP and SMTP."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
base64 = "0.22.1"
chrono = "0.4.45"
quick-xml = "0.41.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1.0.9"
