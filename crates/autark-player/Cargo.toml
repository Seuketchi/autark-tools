[package]
name = "autark-player"
description = "Player: video and audio through GStreamer, in a window of Autark's own."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
autark-common = { version = "0.0.0", path = "../autark-common", features = ["style"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }

[build-dependencies]
cc = "1.2.56"
pkg-config = "0.3.32"
