[package]
name = "autark-accounts"
description = "Accounts: the mail, calendar and contact accounts Autark's apps share, signed in once (org.autark.Accounts1)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
async-io = "2.6.0"
