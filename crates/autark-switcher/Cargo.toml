[package]
name = "autark-switcher"
description = "Alt+Tab as a still row of app icons with the window's title, most recently used first."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
autark-common = { version = "0.0.0", path = "../autark-common", features = ["toplevels", "watch", "style"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
gtk4-layer-shell = "0.8.1"
