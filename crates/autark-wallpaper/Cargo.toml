[package]
name = "autark-wallpaper"
description = "The desktop background: one of the four drawn wallpapers or a picture, on every display."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
autark-common = { version = "0.0.0", path = "../autark-common", features = ["style"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
gtk4-layer-shell = "0.8.1"
