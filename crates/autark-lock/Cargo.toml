[package]
name = "autark-lock"
description = "Lock screen using ext-session-lock and PAM."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
async-channel = "2.5.0"
autark-common = { version = "0.0.0", path = "../autark-common", features = ["style"] }
chrono = "0.4.45"
futures-util = "0.3.34"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
gtk4-session-lock = { version = "0.4.1", features = ["v1_2"] }
pam-client = "0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
zbus = "6.0.0"
zeroize = "1.9.1"

# pam-sys's bindgen and PipeWire's share clang-sys, whose `runtime` feature PipeWire turns on;
# this turns on the matching bindgen feature so a whole-workspace build loads libclang.
[build-dependencies]
bindgen = { version = "0.69", default-features = false, features = ["runtime"] }
