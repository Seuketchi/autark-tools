[package]
name = "autark-bar"
description = "Top bar: app menu, clock, Wi-Fi, battery, volume, notification centre button."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
autark-common = { version = "0.0.0", path = "../autark-common" }
chrono = "0.4.45"
futures-util = "0.3.34"
glib-unix = "0.22.8"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
gtk4-layer-shell = "0.8.1"
serde = { version = "1.0.229", features = ["derive"] }
wayland-client = "0.31.15"
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
zbus = "6.0.0"
