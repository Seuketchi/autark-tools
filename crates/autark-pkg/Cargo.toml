[package]
name = "autark-pkg"
description = "Autark's package manager: signed packages from recipes, with install, remove, upgrade, search and rollback."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
libc = "0.2"
md-5 = "0.10"
minisign = "0.7"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10"
tar = "0.4"
toml = "1.1.8"
ureq = "3"
zstd = { version = "0.13", features = ["zstdmt"] }
