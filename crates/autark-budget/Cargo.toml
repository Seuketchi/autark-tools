[package]
name = "autark-budget"
description = "Budget: electricity first (meter readings, bills and a projected bill), with the rest of your money to follow."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
autark-common = { version = "0.0.0", path = "../autark-common", features = ["style"] }
autark-finance = { version = "0.0.0", path = "../autark-finance" }
chrono = "0.4.45"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
