<?xml version="1.0"?>
<!-- D-Bus policy: /usr/share/dbus-1/system.d/. Root owns the name; anyone may call it, and polkit decides (see
     org.autark.hardware.policy) before the helper changes anything. -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.autark.Hardware1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.autark.Hardware1" send_interface="org.autark.Hardware1"/>
    <allow send_destination="org.autark.Hardware1" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.autark.Hardware1" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
