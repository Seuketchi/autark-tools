[package]
name = "autark-hub"
description = "Software: find, install, update and remove packages from a window; autark-pkg does the work and the checking."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
autark-common = { version = "0.0.0", path = "../autark-common", features = ["style"] }
async-channel = "2.5.0"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zeroize = "1.9.1"
