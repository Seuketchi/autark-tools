[package]
name = "autark-files"
description = "Files app, sharing file code with Notes."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
autark-common = { version = "0.0.0", path = "../autark-common" }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
zbus = "6.0.0"
