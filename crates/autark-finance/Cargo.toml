[package]
name = "autark-finance"
description = "Money, meter readings and bills, and the planner that turns them into a projected bill; no window, so it is tested on its own."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
