[package]
name = "autark-sandbox"
description = "Sandbox launcher: runs vendor binaries under a per-app Landlock profile."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
landlock = "0.4"
libc = "0.2"
rustix = { version = "1", features = ["fs", "mount", "process", "thread"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
