[package]
name = "autark-common"
description = "Shared code: config loading, D-Bus helpers and Linen theme tokens."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# Open windows from the compositor, for the bar and dock.
toplevels = ["dep:glib", "dep:glib-unix", "dep:wayland-client", "dep:wayland-protocols-wlr"]
# Watching config files from a GTK tool, so a change (from Settings or by hand) applies at once.
watch = ["dep:gio", "dep:glib"]

[dependencies]
gio = { version = "0.22", optional = true }
glib = { version = "0.22", optional = true }
glib-unix = { version = "0.22", optional = true }
wayland-client = { version = "0.31", optional = true }
wayland-protocols-wlr = { version = "0.3", features = ["client"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
