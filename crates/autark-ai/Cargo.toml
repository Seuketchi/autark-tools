[package]
name = "autark-ai"
description = "Kith's local daemon (org.autark.AI1): routing, Jev and Ollama, laptop MCP tools, tasks, memory."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
async-io = "2.6.0"
autark-common = { version = "0.0.0", path = "../autark-common", features = ["changes"] }
blocking = "1.7.0"
chrono = "0.4.45"
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
ureq = "3.4.2"
zbus = "6.0.0"
