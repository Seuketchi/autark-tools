[package]
name = "autark-viewer"
description = "Viewer: pictures, with zoom, pan, rotate and the rest of the folder one key away."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
autark-common = { version = "0.0.0", path = "../autark-common", features = ["style"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
