[package]
name = "autark-displays"
description = "Display manager: monitor layouts and scaling, switching automatically on dock."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
async-channel = "2.5.0"
async-io = "2.6.0"
autark-common = { version = "0.0.0", path = "../autark-common" }
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
zbus = "6.0.0"
