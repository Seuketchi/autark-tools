[package]
name = "autark-notifyd"
description = "Notification centre and org.freedesktop.Notifications service, with widgets."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
async-channel = "2.5.0"
autark-common = { version = "0.0.0", path = "../autark-common", features = ["watch", "style"] }
futures-util = "0.3.34"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
gtk4-layer-shell = "0.8.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
ureq = "3.4.2"
zbus = "6.0.0"
