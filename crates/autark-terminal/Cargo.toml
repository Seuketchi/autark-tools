[package]
name = "autark-terminal"
description = "Terminal: tabs, Linen colours, Geist Mono, and Kith's safety check on risky pastes."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
autark-common = { version = "0.0.0", path = "../autark-common", features = ["style"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
serde = { version = "1.0.229", features = ["derive"] }
vte = { version = "0.10.0", package = "vte4" }
