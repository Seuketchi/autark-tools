[package]
name = "autark-keys"
description = "Keyboard shortcuts: every key combination Wayfire is set to answer, read from its own config."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
autark-common = { version = "0.0.0", path = "../autark-common", features = ["style"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
