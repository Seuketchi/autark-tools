[package]
name = "autark-kith"
description = "Kith's team: a roster of named agents, each with a job and a conversation of its own."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
autark-common = { version = "0.0.0", path = "../autark-common", features = ["style"] }
futures-util = "0.3.34"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zbus = "6.0.0"
