[package]
name = "autark-monitor"
description = "Task manager: apps and processes with CPU, memory, disk, network and energy impact; force quit."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
autark-common = { version = "0.0.0", path = "../autark-common" }
futures-util = "0.3.34"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
serde_json = "1.0.154"
zbus = "6.0.0"
